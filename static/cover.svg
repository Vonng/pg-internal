      <stop offset="0" stop-color="#102f49"/>
      <stop offset="0.56" stop-color="#285d83"/>
      <stop offset="1" stop-color="#3f7ba4"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#d9edfa" stroke-opacity=".09" stroke-width="1"/>
