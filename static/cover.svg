    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#071724" flood-opacity=".38"/>
    </filter>
  </defs>

  <rect width="720" height="960" fill="url(#cover)"/>
