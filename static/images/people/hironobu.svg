<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Hironobu Suzuki</title>
  <desc id="desc">以 H 与 S 为主体的深蓝色几何字母头像</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102d45"/>
      <stop offset="1" stop-color="#336791"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="320" height="320" rx="48" fill="url(#bg)"/>
  <rect width="320" height="320" rx="48" fill="url(#grid)"/>
  <circle cx="160" cy="142" r="104" fill="none" stroke="#8bc1e4" stroke-opacity=".32" stroke-width="2"/>
  <circle cx="160" cy="142" r="84" fill="#fff" fill-opacity=".06"/>
  <text x="160" y="171" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="88" font-weight="750" letter-spacing="-6" text-anchor="middle">HS</text>
  <text x="160" y="266" fill="#d8ecf8" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="650" letter-spacing="4" text-anchor="middle">HIRONOBU</text>
</svg>
