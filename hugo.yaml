baseURL: https://pgint.vonng.com/
title: PostgreSQL 技术内幕
enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true
hasCJKLanguage: true
defaultContentLanguage: zh
defaultContentLanguageInSubdir: false

server:
  headers:
    - for: /**
      values:
        Access-Control-Allow-Origin: "*"

outputs:
  home: [HTML, print, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.160.1

languages:
  zh:
    contentDir: content
    label: 简体中文
    locale: zh-CN
    weight: 1
    title: PG 技术内幕
    params:
      description: 深入理解 PostgreSQL 的进程、查询、并发控制、存储、WAL、备份与复制机制。
      time_format_blog: 2006年1月2日
      time_format_default: 2006年1月2日
      comments:
        giscus:
          ariaLabel: 评论
          errorMessage: 评论加载失败，请稍后重试。
    menus:
      main:
        - name: 目录
          identifier: contents
          pageRef: /toc
          weight: 10
          params:
            icon: fa-solid fa-list
        - name: 序言
          identifier: preface
          pageRef: /preface
          weight: 20
          params:
            icon: fa-solid fa-quote-left
        - name: 英文原著
          identifier: original
          url: https://www.interdb.jp/pg/
          weight: 30
          params:
            icon: fa-solid fa-arrow-up-right-from-square
        - name: GitHub
          identifier: github
          url: https://github.com/Vonng/pg-internal
          weight: 90
          params:
            icon: fa-brands fa-github

markup:
  tableOfContents:
    startLevel: 2
    endLevel: 4
  highlight:
    noClasses: false
  goldmark:
    parser:
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)'], ['$', '$']]

params:
  description: 深入理解 PostgreSQL 的进程、查询、并发控制、存储、WAL、备份与复制机制。
  logo: postgresql.svg
  productionURL: https://pgint.vonng.com
  page_width: wide

  copyright:
    authors: >-
      [Hironobu Suzuki](https://www.interdb.jp/) 原著；
      [冯若航](https://vonng.com/)、刘阳明、张文升译
    from_year: 2018
    to_year: present

  github_repo: https://github.com/Vonng/pg-internal
  github_project_repo: https://github.com/Vonng/pg-internal
  github_branch: main
  github_subdir: ""

  time_format_blog: 2006年1月2日
  time_format_default: 2006年1月2日

  offline_search: true
  offline_search_index: summary
  offline_search_summary_length: 160
  offline_search_max_results: 12
  reading_width: normal

  ui:
    shell_types: [book]
    docs_section: ""
    quick_links: [contents, preface]
    sidebar_icon_policy: none
    typography: system
    image_zoom: true
    page_context_menu:
      enable: true
      assistant_links: false
      links: []
    dark_mode:
      enable: true
      show_menu: true
    sidebar_menu_compact: false
    sidebar_menu_foldable: false
    sidebar_menu_truncate: 100
    sidebar_search_disable: false
    sidebar_root_enabled: true
    sidebar_root_menu: false
    sidebar_headings: 2
    sidebar_width_min: 250
    sidebar_width_max: 440
    sidebar_item_overflow: wrap
    breadcrumb: false
    scroll_spy: true
    feedback:
      enable: false
    reading_time: true
    pager_types: [book]
    keyboard_nav: true
    command_palette:
      commands:
        - id: start_reading
          title: 从作者序开始阅读
          description: 进入中文版作者序
          url: /preface/
          icon: fa-solid fa-book-open
          keywords: [开始, 阅读, 作者序]
        - id: chapters
          title: 打开全书目录
          description: 浏览序言与全部 11 个章节
          url: /toc/
          icon: fa-solid fa-list
          keywords: [目录, 章节, 导航]
        - id: print_book
          title: 打印整本书
          description: 打开整书打印视图，可另存为 PDF
          url: /_print/
          icon: fa-solid fa-print
          keywords: [整书, 打印, PDF, print]
        - id: original
          title: 阅读英文原著
          description: 打开持续更新的 The Internals of PostgreSQL
          url: https://www.interdb.jp/pg/
          icon: fa-solid fa-arrow-up-right-from-square
          keywords: [英文, 原著, 最新版本, interdb]
        - id: repository
          title: 打开 GitHub 仓库
          description: 查看源码、历史与问题反馈
          url: https://github.com/Vonng/pg-internal
          icon: fa-brands fa-github
          keywords: [源码, 历史, issue, 勘误]

  comments:
    enable: true
    type: giscus
    giscus:
      repo: Vonng/pg-internal
      repoId: MDEwOlJlcG9zaXRvcnkzOTQ1MTM4NDE=
      category: Announcements
      categoryId: DIC_kwDOF4PNsc4CtkWO
      mapping: pathname
      strict: 0
      reactionsEnabled: 1
      emitMetadata: 0
      inputPosition: bottom
      theme: auto
      loading: lazy

  print:
    toc: true
