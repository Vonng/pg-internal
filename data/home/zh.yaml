faq:
  eyebrow: 常见问题
  title: 关于版本、链接与勘误
  items:
    - question: 这是英文原著当前版本的完整中文翻译吗？
      answer: >-
        不是。本站保留的是 2018 年中文译稿，只有 11 章；英文原著此后持续修订并新增内容。
        学习内部原理时这份译稿仍有价值，但判断当前 PostgreSQL 行为时请对照最新原著和官方文档。
      open: true
    - question: 为什么正文中仍会出现旧参数、旧函数名或旧目录名？
      answer: >-
        它们属于原文所描述版本的实现上下文。校对会修复错误链接和明显笔误，但不会把历史叙述
        直接改写成另一个版本的实现，以免让文字、图示和源码失去一致性。
    - question: 如何报告翻译、技术或链接问题？
      answer: >-
        可以在 [GitHub 仓库](https://github.com/Vonng/pg-internal/issues)提交问题，
        也可以使用文档页右侧的“编辑此页”入口直接提出修改。
      link_label: 提交问题
      url: https://github.com/Vonng/pg-internal/issues
      external: true

