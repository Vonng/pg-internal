# OINK 0.3.0 按此顺序组合首页；内容与呈现保持分离，便于后续调整。
sections:
  - hero
  - metrics
  - type: cards
    key: reading_paths
    id: reading-paths
  - type: gallery
    key: concept_map
    id: concept-map
