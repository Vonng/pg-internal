preface:
  eyebrow: 译者序
  title: 知其然，更要知其所以然
  class: pgint-preface
  body: |
    > 会用只是“知其然”，知道背后的原理，才能“知其所以然”。
    >
    > —— 冯若航、刘阳明、张文升，2018，《PostgreSQL 技术内幕》译者序

    数据库是信息系统的核心组件，关系型数据库则是数据库皇冠上的明珠。理解数据库原理及其具体实现，能让架构师以更小的复杂度实现所需功能，让程序员写出更可靠高效的代码，也让 DBA 在疑难问题面前获得精准的直觉与深刻的洞察。

    PostgreSQL 可以视作关系型数据库实现的典范。它把存储、I/O、查询、事务、恢复与复制凝聚在同一个软件系统中，每个子系统都值得深入研究；而本书最宝贵的价值，正是为这些机制提供了一幅能够彼此连接的全局地图。

    读者可以从数据库集簇与进程架构开始，沿着查询处理、并发控制和存储管理逐层深入，最终抵达 WAL、时间点恢复与流复制。掌握整体结构之后，再阅读源码、追踪性能问题或理解版本变化，都会更有方向。

    这份译稿形成于 2018 年，保留了当时 PostgreSQL 实现的历史语境。学习基本原理时，它仍然清晰而有价值；判断当前版本行为时，则应同时对照持续更新的英文原著与 PostgreSQL 官方文档。

chapters:
  eyebrow: 章节目录
  title: 从数据库集簇，到 WAL 与流复制
  desc: 十一章顺着数据库内部的依赖关系展开：先认识数据、进程与查询，再进入事务与存储，最后理解恢复和高可用。
  class: pgint-chapters
  columns: 3
  items:
    - meta: 第一组 · 第 1–4 章
      title: '[基础架构与查询执行](ch1/)'
      desc: |
        1. [数据库集簇、数据库与数据表](ch1/)
        2. [进程和内存架构](ch2/)
        3. [查询处理](ch3/)
        4. [外部数据包装器与并行查询](ch4/)
    - meta: 第二组 · 第 5–9 章
      title: '[事务、存储与持久性](ch5/)'
      desc: |
        5. [并发控制](ch5/)
        6. [清理过程](ch6/)
        7. [堆内元组与仅索引扫描](ch7/)
        8. [缓冲区管理器](ch8/)
        9. [预写式日志](ch9/)
    - meta: 第三组 · 第 10–11 章
      title: '[恢复与高可用](ch10/)'
      desc: |
        10. [基础备份与时间点恢复](ch10/)
        11. [流复制](ch11/)

